; ---------------------------------------------------------------------------------------------
; Mac profile, tuned on an Apple M1 with 8 GB of memory. Read on macOS only, on top of
; Config/DefaultEngine.ini.
;
; Why: with Lumen, volumetric fog and clouds on, that machine ran out of GPU memory on Play
; (Metal "OutOfMemory"). The lighting rig (ANHLightingRig) also switches those off at run time
; when the machine has 8 GB or less; this file makes the project-wide defaults match.
;
; The game renders through Metal SM5 on that Mac (the engine logs a fall back from SM6), so
; Nanite and Virtual Shadow Maps are not available there whatever is set here.
; ---------------------------------------------------------------------------------------------
[/Script/Engine.RendererSettings]
; No hardware ray tracing
r.RayTracing=False
r.Lumen.HardwareRayTracing=False
; No Lumen: global illumination off (bounce light is faked by the sky light), screen-space reflections
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=2
; Mesh distance fields are only needed by Lumen; leaving them out saves memory
r.GenerateMeshDistanceFields=False
; Cascaded shadow maps
r.Shadow.Virtual.Enable=0

[SystemSettings]
; Cap the texture streaming pool (MB). Memory is shared between the CPU and GPU on Apple Silicon.
r.Streaming.PoolSize=800
; No volumetric fog
r.VolumetricFog=0

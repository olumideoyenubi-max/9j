; ---------------------------------------------------------------------------------------------
; NAIJA HUSTLE rendering settings shared by every platform.
;
; Platform profiles sit on top of this file:
;   Config/Windows/WindowsEngine.ini   Windows + RTX: DX12, SM6, hardware ray-traced Lumen
;   Config/Mac/MacEngine.ini           Apple Silicon (tuned on an M1 with 8 GB): Metal, no ray tracing,
;                                      no Lumen, cascaded shadow maps, texture pool cap
; Unreal reads the platform file after this one, so a value there wins on that platform.
; Most of these need an editor restart (and a shader recompile the first time).
; ---------------------------------------------------------------------------------------------
[/Script/Engine.RendererSettings]
; Lumen for both global illumination and reflections (1 = Lumen). Mac turns both off.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
; Lumen software tracing needs mesh distance fields
r.GenerateMeshDistanceFields=True
; Virtual Shadow Maps. Mac uses cascaded shadow maps.
r.Shadow.Virtual.Enable=1
; Fully dynamic lighting (no lightmap baking) so the day cycle and presets switch instantly
r.AllowStaticLighting=False
; Nanite on for the project. It needs SM6; on Metal SM5 the engine draws the fallback meshes.
r.Nanite.ProjectEnabled=True
; Temporal Super Resolution (4 = TSR)
r.AntiAliasingMethod=4
; Large Megascans textures stream as virtual textures
r.VirtualTextures=True
; Custom depth + stencil, for interaction highlights and the minimap
r.CustomDepth=3
; Auto exposure in physical units (EV100), which the lighting presets are tuned for
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Desktop
AppliedTargetedHardwareClass=Desktop
DefaultGraphicsPerformance=Maximum
AppliedDefaultGraphicsPerformance=Maximum

[/Script/EngineSettings.GameMapsSettings]
GlobalDefaultGameMode=/Script/NaijaHustleGame.NHGameMode
; The packaged game starts in the real-scale city (Scripts/mac.sh names its map itself)
GameDefaultMap=/Game/NaijaHustle/Maps/L_Lagos_City.L_Lagos_City

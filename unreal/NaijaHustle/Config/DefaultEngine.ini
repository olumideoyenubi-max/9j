; ---------------------------------------------------------------------------------------------
; NAIJA HUSTLE rendering baseline: Lumen GI + reflections, Nanite, Virtual Shadow Maps, TSR.
; Most of these need an editor restart (and a shader recompile the first time).
; ---------------------------------------------------------------------------------------------
[/Script/Engine.RendererSettings]
; Lumen for both global illumination and reflections (1 = Lumen)
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
; Lumen software tracing needs mesh distance fields
r.GenerateMeshDistanceFields=True
; Hardware ray tracing for Lumen: sharper reflections on wet roads and glass. Needs DX12 + SM6 and an RTX/RDNA2+ GPU.
; Lighting mode 0 = surface cache (the cheaper path; we'll measure in the performance pass).
r.RayTracing=True
r.Lumen.HardwareRayTracing=True
r.Lumen.HardwareRayTracing.LightingMode=0
; Ray-traced shadows stay off: Virtual Shadow Maps handle shadows
r.RayTracing.Shadows=False
r.Shadow.Virtual.Enable=1
; Skeletal meshes (MetaHumans) in ray tracing need the GPU skin cache
r.SkinCache.CompileShaders=True
r.SkinCache.Mode=1
; Fully dynamic lighting (no lightmap baking) so night/day presets switch instantly
r.AllowStaticLighting=False
; Nanite on for the project; Megascans and the building kit are imported as Nanite meshes
r.Nanite.ProjectEnabled=True
; Temporal Super Resolution (4 = TSR)
r.AntiAliasingMethod=4
; Large Megascans textures stream as virtual textures
r.VirtualTextures=True
; Custom depth + stencil, for interaction highlights and the minimap
r.CustomDepth=3
; Auto exposure in physical units (EV100), which Lumen lighting is tuned for
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Desktop
AppliedTargetedHardwareClass=Desktop
DefaultGraphicsPerformance=Maximum
AppliedDefaultGraphicsPerformance=Maximum

[/Script/EngineSettings.GameMapsSettings]
GlobalDefaultGameMode=/Script/NaijaHustleGame.NHGameMode

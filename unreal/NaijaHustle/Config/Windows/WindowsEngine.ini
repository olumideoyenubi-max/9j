; ---------------------------------------------------------------------------------------------
; Windows + RTX profile: DirectX 12, SM6 and hardware ray-traced Lumen.
; Target: an RTX 3060 or better. Read on Windows only, on top of Config/DefaultEngine.ini.
; ---------------------------------------------------------------------------------------------
[/Script/Engine.RendererSettings]
; Hardware ray tracing for Lumen: sharper reflections on wet roads and glass. Needs DX12 + SM6 and an RTX/RDNA2+ GPU.
; Lighting mode 0 = surface cache (the cheaper path).
r.RayTracing=True
r.Lumen.HardwareRayTracing=True
r.Lumen.HardwareRayTracing.LightingMode=0
; Ray-traced shadows stay off: Virtual Shadow Maps handle shadows
r.RayTracing.Shadows=False
; Skeletal meshes (MetaHumans) in ray tracing need the GPU skin cache
r.SkinCache.CompileShaders=True
r.SkinCache.Mode=1

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

name: Core tests

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run engine-free game logic + content validation tests
        run: dotnet test Tools/CoreTests/CoreTests.csproj --logger "console;verbosity=normal"
